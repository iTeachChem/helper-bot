[package]
name = "helper-bot"
version = "0.2.0"
edition = "2021"
license = "MIT"
publish = false

[features]
# rustls is what Zerops builds; native-tls is handy for local builds on
# machines without a C compiler (ring needs one).
default = ["rustls"]
rustls = ["serenity/rustls_backend", "reqwest/rustls-tls"]
native-tls = ["serenity/native_tls_backend", "reqwest/native-tls"]

[dependencies]
# discord
poise = { version = "0.6", default-features = false, features = ["cache"] }
serenity = { version = "0.12", default-features = false, features = ["builder", "cache", "client", "gateway", "model", "utils"] }

# runtime / web
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "net"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }

# config / env / data
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }
dotenvy = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
anyhow = "1"

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# image generation
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
ab_glyph = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
